name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout original repo (staging branch)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: original

      - name: Checkout staging repo with PAT
        uses: actions/checkout@v4
        with:
          repository: jennyjoseph7/Mastersheetupdater-staging
          token: ${{ secrets.STAGING_PAT }}
          path: staging-deploy

      - name: Copy files and push to staging
        run: |
          # Sync all files from original to staging (except .git and the staging checkout)
          rsync -av --delete \
            --exclude='original' \
            --exclude='.git' \
            ./original/ ./staging-deploy/

          cd staging-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if there are changes
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy staging $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "DEPLOYED=true" >> $GITHUB_ENV
          else
            echo "No changes to deploy"
            echo "DEPLOYED=false" >> $GITHUB_ENV
          fi

      - name: Print staging URL
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Staging deployed!                                     ║"
          echo "║                                                        ║"
          echo "║  https://${OWNER}.github.io/Mastersheetupdater-staging/ ║"
          echo "║                                                        ║"
          echo "║  (Enable Pages in staging repo: Settings → Pages)      ║"
          echo "╚══════════════════════════════════════════════════════════╝"
