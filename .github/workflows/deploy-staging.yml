name: Deploy Staging

on:
  push:
    branches: [staging]

  # Allows you to also trigger manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Check staging PAT secret is set
        run: |
          if [ -z "${{ secrets.STAGING_PAT }}" ]; then
            echo "::error::STAGING_PAT secret is not set."
            echo "::error::Add it in: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Deploy to staging repo
        env:
          # 1. Create a repo called "Mastersheetupdater-staging" on GitHub
          # 2. Create a classic Personal Access Token with "repo" scope:
          #    https://github.com/settings/tokens
          # 3. Add it as a secret here:
          #    Settings → Secrets and variables → Actions → New repository secret
          #    Name: STAGING_PAT
          TOKEN: ${{ secrets.STAGING_PAT }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-push the staging branch contents to the staging repo's main branch
          REPO="${{ github.repository_owner }}/Mastersheetupdater-staging"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            staging:main

      - name: Print staging URL
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Staging deployed!                                     ║"
          echo "║                                                         ║"
          echo "║  https://${OWNER}.github.io/Mastersheetupdater-staging/ ║"
          echo "║                                                         ║"
          echo "║  (Make sure GitHub Pages is enabled on the staging repo)║"
          echo "╚══════════════════════════════════════════════════════════╝
